name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type (release = R8 optimized + 120Hz smooth, debug = unminified)
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      flavor:
        description: APK flavor
        required: true
        default: standard
        type: choice
        options:
          - standard
          - fongmi
          - no_vulkan
      target_abi:
        description: Target ABI
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - all

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.flavor || 'standard' }} ${{ inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native subtitle build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config
          git config --global url."https://github.com/fontconfig/fontconfig.git".insteadOf "https://gitlab.freedesktop.org/fontconfig/fontconfig"
          git config --global --add url."https://github.com/fontconfig/fontconfig.git".insteadOf "https://gitlab.freedesktop.org/fontconfig/fontconfig.git"
          git config --global url."https://github.com/freetype/freetype.git".insteadOf "https://gitlab.freedesktop.org/freetype/freetype"
          git config --global --add url."https://github.com/freetype/freetype.git".insteadOf "https://gitlab.freedesktop.org/freetype/freetype.git"
      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          TARGET_ABI="${{ inputs.target_abi || 'arm64-v8a' }}"
          ABI_ARGS=""
          if [[ "$TARGET_ABI" != "all" ]]; then ABI_ARGS="-PtargetAbi=$TARGET_ABI"; fi
          ./gradlew testStandardDebugUnitTest $ABI_ARGS --stacktrace --no-daemon --max-workers=2 2>&1 | tee /tmp/gradle_test.log || {
            tail -n 40 /tmp/gradle_test.log | while IFS= read -r line; do
              echo "::warning::$line"
            done
          }
      - name: Build APK
        run: |
          chmod +x ./gradlew
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          FLAVOR="${{ inputs.flavor || 'standard' }}"
          TARGET_ABI="${{ inputs.target_abi || 'arm64-v8a' }}"
          ABI_ARGS=""
          if [[ "$TARGET_ABI" != "all" ]]; then ABI_ARGS="-PtargetAbi=$TARGET_ABI"; fi
          if [[ "$BUILD_TYPE" == "release" ]]; then
            case "$FLAVOR" in
              standard) ./gradlew assembleStandardRelease $ABI_ARGS --stacktrace --no-daemon --max-workers=2 2>&1 | tee /tmp/gradle_build.log || { tail -n 60 /tmp/gradle_build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; } ;;
              fongmi) ./gradlew assembleFongmiRelease $ABI_ARGS --stacktrace --no-daemon --max-workers=2 2>&1 | tee /tmp/gradle_build.log || { tail -n 60 /tmp/gradle_build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; } ;;
              no_vulkan) ./gradlew assembleNoVulkanRelease $ABI_ARGS --stacktrace --no-daemon --max-workers=2 2>&1 | tee /tmp/gradle_build.log || { tail -n 60 /tmp/gradle_build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; } ;;
            esac
          else
            case "$FLAVOR" in
              standard) ./gradlew assembleStandardDebug $ABI_ARGS --stacktrace --no-daemon --max-workers=2 2>&1 | tee /tmp/gradle_build.log || { tail -n 60 /tmp/gradle_build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; } ;;
              fongmi) ./gradlew assembleFongmiDebug $ABI_ARGS --stacktrace --no-daemon --max-workers=2 2>&1 | tee /tmp/gradle_build.log || { tail -n 60 /tmp/gradle_build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; } ;;
              no_vulkan) ./gradlew assembleNoVulkanDebug $ABI_ARGS --stacktrace --no-daemon --max-workers=2 2>&1 | tee /tmp/gradle_build.log || { tail -n 60 /tmp/gradle_build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; } ;;
            esac
          fi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpv-infinity-${{ inputs.flavor || 'standard' }}-${{ inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
